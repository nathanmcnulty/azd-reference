name: Audit GitHub repository governance

on:
  schedule:
    - cron: '29 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-governance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the governance contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit repository settings and public registry coverage
        env:
          GH_TOKEN: ${{ secrets.AZD_GOVERNANCE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'Add the AZD_GOVERNANCE_READ_TOKEN Actions secret. It must be a fine-grained, read-only token scoped to the repositories in the governance registry.'
          }

          $reportJson = ./tooling/Get-AzdGitHubGovernanceStatus.ps1 `
            -CheckPublicRegistryCoverage `
            -AsJson
          $reportJson | Set-Content -LiteralPath ./github-governance-status.json -Encoding utf8NoBOM

          $report = @($reportJson | ConvertFrom-Json)
          $report | Format-Table repository, visibility, state -AutoSize
          $findings = @($report | Where-Object state -ne 'current')
          if ($findings.Count -gt 0) {
            throw "GitHub governance drift was found in $($findings.Count) audit result(s)."
          }

      - name: Upload the governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-governance-status
          path: github-governance-status.json
          if-no-files-found: warn
          retention-days: 30
