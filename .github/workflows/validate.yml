name: Validate reference foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select PowerShell 7.6.6
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimePath = Join-Path $env:RUNNER_TEMP 'powershell-7.6.6'
          New-Item -ItemType Directory -Path $runtimePath -ErrorAction Stop | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            $asset = 'PowerShell-7.6.6-win-x64.zip'
            $expectedHash = '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860'
          }
          elseif ($env:RUNNER_OS -eq 'Linux') {
            $asset = 'powershell-7.6.6-linux-x64.tar.gz'
            $expectedHash = 'ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc'
          }
          else { throw 'Unsupported runner platform.' }
          $archivePath = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/$asset" -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expectedHash) {
            throw 'PowerShell archive hash mismatch.'
          }
          if ($env:RUNNER_OS -eq 'Windows') {
            Expand-Archive -LiteralPath $archivePath -DestinationPath $runtimePath
          }
          else {
            tar -xzf $archivePath -C $runtimePath
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell archive extraction failed.' }
            chmod +x (Join-Path $runtimePath 'pwsh')
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell executable permission update failed.' }
          }
          $runtimePath | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Assert selected PowerShell runtime
        run: |
          if ($PSVersionTable.PSVersion -ne [version]'7.6.6' -or -not [Environment]::Is64BitProcess) {
            throw "Expected 64-bit PowerShell 7.6.6; observed $($PSVersionTable.PSVersion)."
          }

      - name: Validate PowerShell syntax and analysis
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $parseErrors = @()
          Get-ChildItem . -Recurse -File | Where-Object Extension -in '.ps1', '.psm1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $errors
            ) | Out-Null
            $parseErrors += @($errors)
          }
          if ($parseErrors.Count) { throw ($parseErrors | Format-List | Out-String) }
          $analysis = @(
            foreach ($manifest in Get-ChildItem ./components -Recurse -File -Filter 'component.json') {
              $analyzerArguments = @{
                Path = $manifest.Directory.FullName
                Recurse = $true
                Settings = './PSScriptAnalyzerSettings.psd1'
              }
              if ($manifest.Directory.Name -eq 'intune-remediations') {
                $modulePath = Join-Path $manifest.Directory.FullName 'Intune.DeviceHealthScripts.psm1'
                $moduleSha256 = (Get-FileHash -LiteralPath $modulePath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($moduleSha256 -cne '580ef85d0a0f24c16c9a2d418cd18fb5704fd62870556ee210e5fae8b639d9f0') {
                  throw "The Intune Remediations 0.1.6 module changed without a component version update."
                }
                $expectedFindings = @(
                  'PSUseSingularNouns|Intune.DeviceHealthScripts.psm1|22|10'
                  'PSUseSingularNouns|Intune.DeviceHealthScripts.psm1|339|10'
                  'PSAvoidAssignmentToAutomaticVariable|Intune.DeviceHealthScripts.psm1|508|5'
                  'PSAvoidUsingEmptyCatchBlock|Intune.DeviceHealthScripts.psm1|534|310'
                  'PSAvoidUsingEmptyCatchBlock|Intune.DeviceHealthScripts.psm1|590|359'
                  'PSAvoidUsingEmptyCatchBlock|Intune.DeviceHealthScripts.psm1|617|364'
                )
                $observedFindings = @(
                  Invoke-ScriptAnalyzer @analyzerArguments | ForEach-Object {
                    '{0}|{1}|{2}|{3}' -f $_.RuleName, $_.ScriptName, $_.Line, $_.Column
                  }
                )
                $findingDrift = @(Compare-Object -ReferenceObject $expectedFindings -DifferenceObject $observedFindings)
                if ($findingDrift.Count) {
                  throw "The exact reviewed Intune Remediations 0.1.6 analyzer finding set changed:`n$($findingDrift | Out-String)"
                }
              }
              elseif ($manifest.Directory.Name -eq 'maester-azd-hooks') {
                # These shared compatibility hooks intentionally preserve their
                # public command names and best-effort cleanup behavior.
                $analyzerArguments.ExcludeRule = @(
                  'PSAvoidGlobalFunctions',
                  'PSAvoidUsingEmptyCatchBlock',
                  'PSUseBOMForUnicodeEncodedFile',
                  'PSUseSingularNouns'
                )
                Invoke-ScriptAnalyzer @analyzerArguments
              }
              else {
                Invoke-ScriptAnalyzer @analyzerArguments
              }
            }
            foreach ($path in './tooling', './skeleton', './examples') {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
            }
          )
          if ($analysis.Count) { throw ($analysis | Format-Table | Out-String) }

      - name: Select the pinned Bicep compiler before compiled contract tests
        run: az bicep install --version v0.42.1

      - name: Run contract and synchronization tests
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Install-Module Microsoft.Graph.Authentication -RequiredVersion 2.38.0 -Force -Scope CurrentUser
          Invoke-Pester ./tests -CI

      - name: Validate the repository backlog and generated review view
        run: |
          ./tooling/Test-AzdBacklog.ps1 | Out-Null
          ./tooling/Export-AzdBacklogMarkdown.ps1 -Check | Out-Null

      - name: Test and reproduce the catalog validator package
        working-directory: ./.github/actions/catalog-validator
        run: |
          npm ci
          npm test
          npm run build

      - name: Enforce canonical component version changes
        run: |
          $baseRevision = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            "origin/$env:GITHUB_BASE_REF"
          } else {
            'HEAD^'
          }
          ./tooling/Test-AzdComponentVersion.ps1 -BaseRevision $baseRevision

      - name: Validate the skeleton as a locked consumer
        run: |
          Get-Content ./skeleton/azd-components.lock.json -Raw |
            Test-Json -SchemaFile ./schemas/azd-components-lock.schema.json -ErrorAction Stop | Out-Null
          ./tooling/Test-AzdComponentDrift.ps1 -TargetPath ./skeleton
          ./tooling/Sync-AzdComponent.ps1 -Component deployment-validation -TargetPath ./skeleton -WhatIf | Out-Null

      - name: Build Bicep
        run: |
          az bicep build --file ./components/powershell/foundry-stateless-agent/foundry-stateless-agent.bicep --stdout | Out-Null
          az bicep build --file ./skeleton/infra/main.bicep --stdout | Out-Null
          az bicep build --file ./examples/deployment-check/infra/main.bicep --stdout | Out-Null
          az bicep build --file ./components/bicep/azure-monitor-scheduled-query-notifications/logic-app-action-group.bicep --stdout | Out-Null
          az bicep build --file ./components/bicep/azure-monitor-scheduled-query-notifications/scheduled-query-alert.bicep --stdout | Out-Null
          az bicep build --file ./components/bicep/flex-scheduled-poller-host/flex-scheduled-poller-host.bicep --stdout | Out-Null
          $pollerTemplate = Join-Path $env:RUNNER_TEMP 'flex-scheduled-poller-migration.json'
          az bicep build --file ./tests/fixtures/bicep/flex-scheduled-poller-host/migration-wrapper.bicep --outfile $pollerTemplate
          ./tests/Assert-FlexScheduledPollerCompiledTemplate.ps1 -TemplatePath $pollerTemplate
          $pimIdentityTemplate = Join-Path $env:RUNNER_TEMP 'flex-pim-identity.json'
          $riskIdentityTemplate = Join-Path $env:RUNNER_TEMP 'flex-risk-identity.json'
          az bicep build --file ./tests/fixtures/bicep/flex-scheduled-poller-host/pim-wrapper.bicep --outfile $pimIdentityTemplate
          az bicep build --file ./tests/fixtures/bicep/flex-scheduled-poller-host/risk-wrapper.bicep --outfile $riskIdentityTemplate
          ./tests/Assert-FlexIdentityCompiledTemplate.ps1 -Shape Pim -TemplatePath $pimIdentityTemplate
          ./tests/Assert-FlexIdentityCompiledTemplate.ps1 -Shape Risk -TemplatePath $riskIdentityTemplate
          $legacyFlexTemplate = Join-Path $env:RUNNER_TEMP 'flex-legacy-0.1.0.json'
          az bicep build --file ./tests/fixtures/bicep/flex-scheduled-poller-host/legacy-0.1.0.bicep --outfile $legacyFlexTemplate
          ./tests/Test-FlexIdentityCompiledNegative.ps1 -PimTemplatePath $pimIdentityTemplate -RiskTemplatePath $riskIdentityTemplate -LegacyTemplatePath $legacyFlexTemplate
          $compiledRoot = Join-Path $env:RUNNER_TEMP 'azure-monitor-notification-fixtures'
          New-Item -ItemType Directory -Path $compiledRoot -Force | Out-Null
          $pimTemplate = Join-Path $compiledRoot 'pim-wrapper.json'
          $riskTemplate = Join-Path $compiledRoot 'risk-wrapper.json'
          az bicep build --file ./tests/fixtures/bicep/azure-monitor-scheduled-query-notifications/pim-wrapper.bicep --outfile $pimTemplate
          az bicep build --file ./tests/fixtures/bicep/azure-monitor-scheduled-query-notifications/risk-wrapper.bicep --outfile $riskTemplate
          ./tests/Assert-AzureMonitorCompiledTemplate.ps1 -Shape Pim -TemplatePath $pimTemplate
          ./tests/Assert-AzureMonitorCompiledTemplate.ps1 -Shape Risk -TemplatePath $riskTemplate
          ./tests/Test-AzureMonitorCompiledAssertionNegative.ps1 -PimTemplatePath $pimTemplate -RiskTemplatePath $riskTemplate

      - name: Confirm validation left the checkout clean
        run: git diff --exit-code
