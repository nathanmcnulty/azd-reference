name: Prepare portfolio component updates

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
    inputs:
      consumer:
        description: Exact registered consumer ID (one repository only)
        required: true
        type: string
      plan_only:
        description: Report candidates without preparation, App authentication, or publication
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - portfolio/consumers.json

permissions:
  contents: read

concurrency:
  group: portfolio-component-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.candidates.outputs.matrix }}
      has-updates: ${{ steps.candidates.outputs.has-updates }}
      publish-allowed: ${{ steps.scope.outputs.publish-allowed }}
    steps:
      - name: Check out reference repository and component tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: portfolio/azd-reference
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested execution scope
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_CONSUMER: ${{ inputs.consumer }}
          PLAN_ONLY: ${{ inputs.plan_only }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:SELECTED_CONSUMER -cnotmatch '\A[a-z][a-z0-9-]{1,62}[a-z0-9]\z') {
              throw 'Manual runs require one exact registered consumer ID.'
            }
            if ($env:PLAN_ONLY -cnotin @('true', 'false')) { throw 'Manual runs require an explicit plan-only boolean.' }
          }
          $allowed = $env:EVENT_NAME -ne 'workflow_dispatch' -or $env:PLAN_ONLY -ceq 'false'
          "publish-allowed=$allowed".ToLowerInvariant() | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Check out registered public consumers
        shell: pwsh
        env:
          SELECTED_CONSUMER: ${{ inputs.consumer }}
        run: |
          $referenceRoot = Resolve-Path ./portfolio/azd-reference
          $registryPath = Join-Path $referenceRoot 'portfolio/consumers.json'
          $schemaPath = Join-Path $referenceRoot 'schemas/portfolio-consumers.schema.json'
          $registryRaw = Get-Content -LiteralPath $registryPath -Raw
          $registryRaw | Test-Json -SchemaFile $schemaPath -ErrorAction Stop | Out-Null
          $registry = $registryRaw | ConvertFrom-Json
          $consumers = @($registry.consumers)
          if ($env:SELECTED_CONSUMER) {
            $consumers = @($consumers | Where-Object { $_.id -ceq $env:SELECTED_CONSUMER })
            if ($consumers.Count -ne 1) { throw 'The consumer selector is unknown or ambiguous.' }
          }
          foreach ($consumer in $consumers) {
            if ([string] $consumer.repository -notmatch '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
              throw "Only public GitHub consumers may be reconciled: '$($consumer.repository)'."
            }
            $target = Join-Path ./portfolio ([string] $consumer.checkoutDirectory)
            & git clone --depth 1 --single-branch --branch ([string] $consumer.defaultBranch) -- ([string] $consumer.repository) $target
            if ($LASTEXITCODE -ne 0) { throw "Unable to clone '$($consumer.id)'." }
          }

      - name: Audit and select explicitly approved updates
        id: candidates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_CONSUMER: ${{ inputs.consumer }}
        run: |
          $referenceRoot = Resolve-Path ./portfolio/azd-reference
          $statusPath = Join-Path $PWD 'portfolio-status.json'
          & (Join-Path $referenceRoot 'tooling/Get-AzdPortfolioStatus.ps1') `
            -PortfolioRoot ./portfolio `
            -AsJson | Set-Content -LiteralPath $statusPath -Encoding utf8NoBOM
          $matrix = & (Join-Path $referenceRoot 'tooling/Get-AzdPortfolioUpdateCandidates.ps1') `
            -PortfolioRoot ./portfolio `
            -StatusPath $statusPath `
            -ConsumerId $env:SELECTED_CONSUMER `
            -ExcludeOpenPullRequests `
            -DiagnosticsPath ./portfolio-update-selection.json `
            -AsJson
          if ($LASTEXITCODE -ne 0) { throw 'Unable to select portfolio update candidates.' }
          $matrix | Set-Content -LiteralPath ./portfolio-update-plan.json -Encoding utf8NoBOM
          $candidateCount = @($matrix | ConvertFrom-Json).Count
          "matrix=$matrix" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM
          "has-updates=$($candidateCount -gt 0)".ToLowerInvariant() | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Explain portfolio update readiness
        if: always()
        shell: pwsh
        env:
          SELECTED_CONSUMER: ${{ inputs.consumer }}
        run: |
          if (-not (Test-Path -LiteralPath ./portfolio-status.json -PathType Leaf)) {
            'Portfolio readiness is unknown: the status audit did not produce a report. Review the preceding failed step.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          else {
            & ./portfolio/azd-reference/tooling/Get-AzdPortfolioUpdateReport.ps1 `
              -StatusPath ./portfolio-status.json `
              -CandidatesPath ./portfolio-update-plan.json `
              -SelectionDiagnosticsPath ./portfolio-update-selection.json `
              -ConsumerId $env:SELECTED_CONSUMER `
              -SummaryPath ./portfolio-update-readiness.md `
              -AsJson | Set-Content -LiteralPath ./portfolio-update-readiness.json -Encoding utf8NoBOM
            Get-Content -LiteralPath ./portfolio-update-readiness.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload portfolio report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-update-status
          path: |
            portfolio-status.json
            portfolio-update-plan.json
            portfolio-update-selection.json
            portfolio-update-readiness.json
            portfolio-update-readiness.md
          if-no-files-found: error
          retention-days: 30

  prepare:
    permissions:
      contents: read
      actions: read
    needs: discover
    if: needs.discover.outputs.has-updates == 'true' && needs.discover.outputs.publish-allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SELECTED_CONSUMER: ${{ inputs.consumer }}
      PLAN_ONLY: ${{ inputs.plan_only }}
      CANDIDATE_JSON: ${{ toJSON(matrix) }}
      TARGET_DIRECTORY: ${{ matrix.checkoutDirectory }}
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_DEFAULT_BRANCH: ${{ matrix.defaultBranch }}
      TARGET_CONSUMER: ${{ matrix.consumer }}
      TARGET_COMPONENT: ${{ matrix.component }}
      TARGET_VERSION: ${{ matrix.version }}
      TARGET_BRANCH: ${{ matrix.branch }}
    steps:
      - name: Check out reference repository and component tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: portfolio/azd-reference
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the registry-bound candidate scope
        shell: pwsh
        run: |
          & ./portfolio/azd-reference/tooling/Assert-AzdPortfolioUpdateScope.ps1 `
            -CandidateJson $env:CANDIDATE_JSON -ConsumerId $env:SELECTED_CONSUMER `
            -PlanOnly:($env:PLAN_ONLY -ceq 'true') -ForPublication

      - name: Check out the exact registered consumer default branch
        shell: pwsh
        run: |
          $target = Join-Path ./portfolio $env:TARGET_DIRECTORY
          & git clone --single-branch --branch $env:TARGET_DEFAULT_BRANCH -- $env:TARGET_REPOSITORY $target
          if ($LASTEXITCODE -ne 0) { throw "Unable to clone $env:TARGET_CONSUMER." }

      - name: Acquire and verify the exact component release bundle
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $referenceRoot = Resolve-Path ./portfolio/azd-reference
          $tag = "component/$env:TARGET_COMPONENT/v$env:TARGET_VERSION"
          $revision = @(& git --no-replace-objects -C $referenceRoot rev-parse --verify --quiet --end-of-options "refs/tags/${tag}^{commit}")
          if ($LASTEXITCODE -ne 0 -or $revision.Count -ne 1 -or $revision[0] -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The selected release tag does not resolve to an exact commit.'
          }
          $bundlePath = Join-Path $env:RUNNER_TEMP 'component-release.tar.gz'
          & (Join-Path $referenceRoot 'tooling/Get-AzdComponentReleaseBundle.ps1') `
            -ExpectedRepository 'nathanmcnulty/azd-reference' -ExpectedTag $tag `
            -ExpectedCommit $revision[0] -DestinationPath $bundlePath | Out-Null
          & (Join-Path $referenceRoot 'tooling/Test-AzdReleaseIntegrity.ps1') `
            -AcceptComponentRelease -RepositoryRoot $referenceRoot `
            -ExpectedRepository 'nathanmcnulty/azd-reference' -ExpectedTag $tag `
            -ExpectedCommit $revision[0] -BundlePath $bundlePath | Out-Null
          "revision=$($revision[0])" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Prepare and validate locally without a write credential
        shell: pwsh
        env:
          EXPECTED_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          $referenceRoot = Resolve-Path ./portfolio/azd-reference
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'azd-component-update-worktrees') -Force | Out-Null
          & (Join-Path $referenceRoot 'tooling/Update-AzdPortfolio.ps1') `
            -Component $env:TARGET_COMPONENT `
            -Version $env:TARGET_VERSION `
            -ConsumerId $env:TARGET_CONSUMER `
            -PortfolioRoot ./portfolio `
            -WorktreeRoot (Join-Path $env:RUNNER_TEMP 'azd-component-update-worktrees') `
            -Operation Prepare `
            -ExpectedRevision $env:EXPECTED_REVISION `
            -Confirm:$false
          if ($LASTEXITCODE -ne 0) { throw 'Component preparation or consumer validation failed.' }

      - name: Package only the validated Git branch
        shell: pwsh
        run: |
          $consumerRoot = Resolve-Path (Join-Path ./portfolio $env:TARGET_DIRECTORY)
          $bundlePath = Join-Path $env:RUNNER_TEMP 'prepared-branch.bundle'
          & git -C $consumerRoot bundle create $bundlePath "refs/heads/$env:TARGET_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to package the validated branch.' }
          & git -C $consumerRoot bundle verify $bundlePath
          if ($LASTEXITCODE -ne 0) { throw 'The validated branch bundle is invalid.' }

      - name: Transfer the validated branch without credentials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-${{ matrix.consumer }}-${{ matrix.component }}-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/prepared-branch.bundle
            ${{ runner.temp }}/component-release.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [discover, prepare]
    if: needs.discover.outputs.has-updates == 'true' && needs.discover.outputs.publish-allowed == 'true' && vars.AZD_PORTFOLIO_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: portfolio-updates
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SELECTED_CONSUMER: ${{ inputs.consumer }}
      PLAN_ONLY: ${{ inputs.plan_only }}
      CANDIDATE_JSON: ${{ toJSON(matrix) }}
      TARGET_DIRECTORY: ${{ matrix.checkoutDirectory }}
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_DEFAULT_BRANCH: ${{ matrix.defaultBranch }}
      TARGET_CONSUMER: ${{ matrix.consumer }}
      TARGET_COMPONENT: ${{ matrix.component }}
      TARGET_VERSION: ${{ matrix.version }}
      TARGET_BRANCH: ${{ matrix.branch }}
    steps:
      - name: Check out reference repository and component tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: portfolio/azd-reference
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the registry-bound candidate scope
        shell: pwsh
        run: |
          & ./portfolio/azd-reference/tooling/Assert-AzdPortfolioUpdateScope.ps1 `
            -CandidateJson $env:CANDIDATE_JSON -ConsumerId $env:SELECTED_CONSUMER `
            -PlanOnly:($env:PLAN_ONLY -ceq 'true') -ForPublication

      - name: Check out the exact registered consumer default branch
        shell: pwsh
        run: |
          $target = Join-Path ./portfolio $env:TARGET_DIRECTORY
          & git clone --single-branch --branch $env:TARGET_DEFAULT_BRANCH -- $env:TARGET_REPOSITORY $target
          if ($LASTEXITCODE -ne 0) { throw "Unable to clone $env:TARGET_CONSUMER." }

      - name: Download the branch validated on the credential-free runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prepared-${{ matrix.consumer }}-${{ matrix.component }}-${{ matrix.version }}
          path: ${{ runner.temp }}/prepared-branch

      - name: Restore the exact validated branch
        shell: pwsh
        run: |
          $consumerRoot = Resolve-Path (Join-Path ./portfolio $env:TARGET_DIRECTORY)
          $bundlePath = Join-Path $env:RUNNER_TEMP 'prepared-branch/prepared-branch.bundle'
          & git -C $consumerRoot bundle verify $bundlePath
          if ($LASTEXITCODE -ne 0) { throw 'The downloaded branch bundle is invalid.' }
          & git -C $consumerRoot fetch $bundlePath "refs/heads/${env:TARGET_BRANCH}:refs/heads/${env:TARGET_BRANCH}"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore the validated branch.' }

      - name: Recheck publication scope and release before App authentication
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./portfolio/azd-reference/tooling/Assert-AzdPortfolioUpdateScope.ps1 `
            -CandidateJson $env:CANDIDATE_JSON -ConsumerId $env:SELECTED_CONSUMER `
            -PlanOnly:($env:PLAN_ONLY -ceq 'true') -ForPublication
          $referenceRoot = Resolve-Path ./portfolio/azd-reference
          $tag = "component/$env:TARGET_COMPONENT/v$env:TARGET_VERSION"
          $revision = @(& git --no-replace-objects -C $referenceRoot rev-parse --verify --quiet --end-of-options "refs/tags/${tag}^{commit}")
          if ($LASTEXITCODE -ne 0 -or $revision.Count -ne 1 -or $revision[0] -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The selected release tag does not resolve to an exact commit.'
          }
          # Compare transferred lock provenance to the trusted selected tag.
          # Never obtain the expected revision from downloaded metadata.
          $registry = Get-Content (Join-Path $referenceRoot 'portfolio/consumers.json') -Raw | ConvertFrom-Json
          $consumer = @($registry.consumers | Where-Object { $_.id -ceq $env:TARGET_CONSUMER })[0]
          $lockPath = if ($consumer.solutionRoot -ceq '.') { 'azd-components.lock.json' } else {
            $consumer.solutionRoot.TrimEnd('/').Replace('\', '/') + '/azd-components.lock.json'
          }
          $consumerRoot = Resolve-Path (Join-Path ./portfolio $env:TARGET_DIRECTORY)
          $lockRaw = @(& git --no-replace-objects -C $consumerRoot show "refs/heads/${env:TARGET_BRANCH}:$lockPath")
          if ($LASTEXITCODE -ne 0) { throw 'The prepared branch lock is unavailable.' }
          $lockJson = $lockRaw -join "`n"
          if (-not ($lockJson | Test-Json -SchemaFile (Join-Path $referenceRoot 'schemas/azd-components-lock.schema.json') -ErrorAction Stop)) {
            throw 'Prepared lock does not satisfy its schema.'
          }
          $locked = @(($lockJson | ConvertFrom-Json).components | Where-Object { $_.id -ceq $env:TARGET_COMPONENT })
          if ($locked.Count -ne 1 -or $locked[0].sourceRevision -cne $revision[0] -or
              $locked[0].version -cne $env:TARGET_VERSION -or
              $locked[0].sourceRepository -cne 'https://github.com/nathanmcnulty/azd-reference') {
            throw 'Prepared lock provenance does not match the selected release.'
          }
          & (Join-Path $referenceRoot 'tooling/Test-AzdReleaseIntegrity.ps1') `
            -AcceptComponentRelease -RepositoryRoot $referenceRoot `
            -ExpectedRepository 'nathanmcnulty/azd-reference' -ExpectedTag $tag `
            -ExpectedCommit $revision[0] `
            -BundlePath (Join-Path $env:RUNNER_TEMP 'prepared-branch/component-release.tar.gz') | Out-Null
          "revision=$($revision[0])" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - name: Mint a repository-scoped GitHub App token after validation
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AZD_PORTFOLIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.AZD_PORTFOLIO_APP_PRIVATE_KEY }}
          owner: ${{ matrix.repositoryOwner }}
          repositories: ${{ matrix.repositoryName }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish the exact prevalidated branch as a draft pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AZD_RELEASE_READ_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          & ./portfolio/azd-reference/tooling/Assert-AzdPortfolioUpdateScope.ps1 `
            -CandidateJson $env:CANDIDATE_JSON -ConsumerId $env:SELECTED_CONSUMER `
            -PlanOnly:($env:PLAN_ONLY -ceq 'true') -ForPublication
          gh auth setup-git
          $referenceRoot = Resolve-Path ./portfolio/azd-reference
          & (Join-Path $referenceRoot 'tooling/Publish-AzdPortfolioUpdates.ps1') `
            -Component $env:TARGET_COMPONENT `
            -Version $env:TARGET_VERSION `
            -ConsumerId $env:TARGET_CONSUMER `
            -PortfolioRoot ./portfolio `
            -WorktreeRoot (Join-Path $env:RUNNER_TEMP 'unused-publish-worktrees') `
            -PreparedBranchesOnly `
            -ExpectedRevision $env:EXPECTED_REVISION `
            -ReleaseBundlePath (Join-Path $env:RUNNER_TEMP 'prepared-branch/component-release.tar.gz') `
            -Confirm:$false
          if ($LASTEXITCODE -ne 0) { throw 'Draft pull-request publication failed.' }

  configuration-required:
    needs: [discover, prepare]
    if: needs.discover.outputs.has-updates == 'true' && needs.discover.outputs.publish-allowed == 'true' && vars.AZD_PORTFOLIO_APP_CLIENT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Explain the missing publication credential
        shell: pwsh
        run: |
          Write-Error 'Approved updates are waiting, but AZD_PORTFOLIO_APP_CLIENT_ID is not configured.'
